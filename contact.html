<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Me</title>
</head>
<style>

body {
    background-color: #F7D6E8;
    color: #49364B;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.7;
    margin: 0;
    padding: 25px;
}
h1 {
    color: #984996;
    text-align: center;
    font-size: 34px;
    margin-top: 35px;
}
nav {
    background-color: #FFF7FB;
    padding: 18px;
    text-align: center;
    border-radius: 15px;
    box-shadow: 0 4px 12px #D9B5CE;
    margin-bottom: 30px;
}
nav a {
    color:#984996;
    text-decoration: none;
    margin: 20px;
    font-weight: bold;
}
form {
    background-color: #FFF7FB;
    padding: 30px;
    max-width: 450px;
    margin: 30px auto;
    border-radius: 18px;
    box-shadow: 0 5px 15px #D9B5CE;}
    label {
    color: #A64D79;
    font-weight: bold;
    }
    
    button {
    background-color: #A64D79;
    color: white;
    padding: 12px 30px;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}
button:hover {
    background-color: #81395F;
}
input, textarea {
    width: 100%;
    padding: 12px;
    margin-top: 8px;
    margin-bottom: 15px;
    border: 1px solid #DDA5C5;
    border-radius: 10px;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
    font-size: 15px;
}
p {
    text-align: center;
    font-size: 17px;
    color: #49364B;
    margin-bottom: 25px;
}
h4 {
    text-align: center;
    color: #984996;
    font-size: 18px;
    font-weight: 500;
    margin-bottom: 25px;
}


</style>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="contact.html">Contact Me</a>
    </nav>

    <h1>Contact Me  :</h1>

    <h4>Please complete the form below...</h4>

    <form id="contactform">
        <label>Full name:</label>
        <br>
        <input type="text" id="fullname">
        <br>
        <label>Email Address</label>
        <br>
        <input type="email" id="email">
        <br>
        <label>Country:</label>
        <br>

        <input type="text" id="country">

        <br><br>
        <label>Comments:</label>
        <br>

        <textarea id="comments" rows="5" cols="30"></textarea>

        <br><br>
        <button type="submit">Submit</button>
    </form>
    <script>

        document.getElementById("contactform").addEventListener("submit", function (event) {

            event.preventDefault();

            let name = document.getElementById("fullname").value.trim();
            let email = document.getElementById("email").value.trim();
            let country = document.getElementById("country").value.trim();
            let comments = document.getElementById("comments").value.trim();

            if (name === "" || email === "" || country === "" || comments === "") {

                alert("Please fill in all fields!");

            } else {

                alert("Form submitted successfully!");

            }

        });

    </script>

</body>

</html>
